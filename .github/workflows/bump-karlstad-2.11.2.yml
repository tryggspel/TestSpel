name: Bump Karlstad 2.11.2

on:
  push:
    branches: [karlstad-2.11.2-release]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: karlstad-2.11.2-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set one version and cache key
        run: node playcanvas-karlstad-2.11/tools/set-version.mjs 2.11.2
      - name: Test
        working-directory: playcanvas-karlstad-2.11
        run: |
          node --test tests/*.mjs
          node tools/set-version.mjs
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/bump-karlstad-2.11.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playcanvas-karlstad-2.11 .github/workflows/bump-karlstad-2.11.2.yml
          git commit -m "Release Karlstad 2.11.2 with fresh cache keys"
          git push origin HEAD:karlstad-2.11.2-release
