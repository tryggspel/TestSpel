name: Render Karlstad Game Audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/render-karlstad-audio.py'
      - '.github/workflows/render-karlstad-audio.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render
        run: |
          python -m pip install --disable-pip-version-check numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          python tools/render-karlstad-audio.py
      - name: Commit audio assets
        run: |
          git config user.name "tryggspel"
          git config user.email "kmauritz@gmail.com"
          git add playcanvas-karlstad-next/audio
          if git diff --cached --quiet; then
            echo "No audio changes"
            exit 0
          fi
          git commit -m "Render Karlstad City game audio assets"
          git push
