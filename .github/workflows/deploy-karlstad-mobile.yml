name: Deploy Karlstad City Mobile

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'karlstad-city-mobile/**'
      - 'playcanvas-karlstad/**'
      - 'playcanvas-karlstad-next/**'
      - 'playcanvas-karlstad-2.11/**'
      - 'eduke32-karlstad/**'
      - 'eduke32-vanilla/**'
      - 'eduke32-diagnostic/**'
      - '.github/workflows/deploy-karlstad-mobile.yml'
      - '.github/workflows/karlstad-2.11-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nytt: ingen deploy om testerna fallerar.
  test:
    uses: ./.github/workflows/karlstad-2.11-tests.yml

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site/karlstad-city-mobile
          cp index.html _site/index.html
          cp -R karlstad-city-mobile/. _site/karlstad-city-mobile/
          if [ -d playcanvas-karlstad ]; then
            mkdir -p _site/playcanvas-karlstad
            cp -R playcanvas-karlstad/. _site/playcanvas-karlstad/
          fi
          if [ -d playcanvas-karlstad-next ]; then
            mkdir -p _site/playcanvas-karlstad-next
            cp -R playcanvas-karlstad-next/. _site/playcanvas-karlstad-next/
          fi
          if [ -d playcanvas-karlstad-2.11 ]; then
            mkdir -p _site/playcanvas-karlstad-2.11
            cp -R playcanvas-karlstad-2.11/. _site/playcanvas-karlstad-2.11/
            rm -rf _site/playcanvas-karlstad-2.11/tests _site/playcanvas-karlstad-2.11/tools
          fi
          if [ -d eduke32-karlstad ]; then
            mkdir -p _site/eduke32-karlstad
            cp -R eduke32-karlstad/. _site/eduke32-karlstad/
          fi
          if [ -d eduke32-vanilla ]; then
            mkdir -p _site/eduke32-vanilla
            cp -R eduke32-vanilla/. _site/eduke32-vanilla/
          fi
          if [ -d eduke32-diagnostic ]; then
            mkdir -p _site/eduke32-diagnostic
            cp -R eduke32-diagnostic/. _site/eduke32-diagnostic/
          fi
          touch _site/.nojekyll
      - name: Upload Karlstad City
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
