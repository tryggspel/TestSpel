name: Deploy Karlstad City Mobile

on:
  push:
    branches: [main]
    paths:
      - 'karlstad-city-mobile/**'
      - '.github/workflows/deploy-karlstad-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Karlstad City
        uses: actions/upload-pages-artifact@v4
        with:
          path: karlstad-city-mobile
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
