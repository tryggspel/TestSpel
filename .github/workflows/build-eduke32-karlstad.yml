name: Build EDuke32 Karlstad Prototype

on:
  push:
    branches: [main]
    paths:
      - 'eduke32-karlstad-prototype/**'
      - '.github/workflows/build-eduke32-karlstad.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eduke32-karlstad-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EDUKE32_UPSTREAM_SHA: 37b56eefaf8125eaa853c417512019cc7ad94b81
    steps:
      - name: Checkout Karlstad repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Karlstad BUILD map
        run: |
          mkdir -p /tmp/karlstad-build
          python3 eduke32-karlstad-prototype/tools/osm_to_build_map.py \
            --osm karlstad-city-mobile/data/osm-buildings.json \
            --out /tmp/karlstad-build/KARLSTAD.MAP \
            --meta /tmp/karlstad-build/karlstad-map-meta.json
          ls -lh /tmp/karlstad-build

      - name: Checkout pinned EDuke32-WASM
        run: |
          git clone https://github.com/DigitalCyberSoft/eduke32-wasm.git /tmp/eduke32-wasm
          cd /tmp/eduke32-wasm
          git checkout "$EDUKE32_UPSTREAM_SHA"

      - name: Build EDuke32 browser transport
        working-directory: /tmp/eduke32-wasm/platform/emscripten
        run: |
          npm ci
          npm test
          npm run build:net

      - name: Build EDuke32 WebAssembly
        working-directory: /tmp/eduke32-wasm
        run: |
          emcc --version
          make PLATFORM=EMSCRIPTEN EM_SINGLE_FILE=0 NETDUKE32=1 -j"$(nproc)"

      - name: Assemble Karlstad prototype
        run: |
          rm -rf eduke32-karlstad
          mkdir -p eduke32-karlstad
          cp /tmp/eduke32-wasm/eduke32.js eduke32-karlstad/
          cp /tmp/eduke32-wasm/eduke32.wasm eduke32-karlstad/
          cp /tmp/eduke32-wasm/eduke32.data eduke32-karlstad/
          cp /tmp/eduke32-wasm/platform/emscripten/eduke32-net.js eduke32-karlstad/
          cp /tmp/eduke32-wasm/platform/emscripten/grp-manifest.json eduke32-karlstad/ 2>/dev/null || true
          cp /tmp/karlstad-build/KARLSTAD.MAP eduke32-karlstad/
          cp /tmp/karlstad-build/karlstad-map-meta.json eduke32-karlstad/
          cp /tmp/eduke32-wasm/source/build/buildlic.txt eduke32-karlstad/BUILDLIC.TXT
          cp /tmp/eduke32-wasm/assets/shareware/LICENSE.TXT eduke32-karlstad/SHAREWARE-LICENSE.TXT
          python3 eduke32-karlstad-prototype/tools/patch_shell.py \
            --infile /tmp/eduke32-wasm/platform/emscripten/index.html \
            --outfile eduke32-karlstad/index.html
          BUILD_ID="karlstad-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)"
          sed -i "s/__BUILD_ID__/${BUILD_ID}/g" eduke32-karlstad/index.html
          printf '%s\n' \
            'Karlstad City BUILD/EDuke32 WASM prototype' \
            "Upstream EDuke32-WASM: ${EDUKE32_UPSTREAM_SHA}" \
            "Build: ${BUILD_ID}" \
            'Map generated from TestSpel/karlstad-city-mobile/data/osm-buildings.json.' \
            'Prototype only. BUILD source license is included as BUILDLIC.TXT.' \
            > eduke32-karlstad/PROTOTYPE.txt
          ls -lh eduke32-karlstad

      - name: Commit built prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eduke32-karlstad
          if git diff --cached --quiet; then
            echo "No prototype output changes."
            exit 0
          fi
          git commit -m "Build EDuke32 Karlstad WASM prototype [skip eduke32]"
          git push origin HEAD:main