name: Update Karlstad OSM Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-karlstad-osm.yml'
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: karlstad-osm-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download OSM map extract
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api.openstreetmap.org/api/0.6/map?bbox=13.4974,59.3780,13.5086,59.3857'
          curl --fail --location --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             --connect-timeout 15 --max-time 120             "$URL" -o /tmp/karlstad.osm
          test -s /tmp/karlstad.osm
          echo "OSM extract: $(wc -c < /tmp/karlstad.osm) bytes"

      - name: Build browser snapshot files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p karlstad-city-mobile/data
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone

          src = Path('/tmp/karlstad.osm')
          root = ET.parse(src).getroot()

          nodes = {}
          tree_nodes = []
          for n in root.findall('node'):
              nid = int(n.attrib['id'])
              lat = float(n.attrib['lat'])
              lon = float(n.attrib['lon'])
              tags = {t.attrib['k']: t.attrib['v'] for t in n.findall('tag')}
              nodes[nid] = {'lat': lat, 'lon': lon}
              if tags.get('natural') == 'tree':
                  tree_nodes.append({
                      'type':'node','id':nid,'lat':lat,'lon':lon,'tags':tags
                  })

          buildings, roads, environment = [], [], []
          for w in root.findall('way'):
              wid = int(w.attrib['id'])
              tags = {t.attrib['k']: t.attrib['v'] for t in w.findall('tag')}
              geom = []
              missing = False
              for nd in w.findall('nd'):
                  ref = int(nd.attrib['ref'])
                  p = nodes.get(ref)
                  if not p:
                      missing = True
                      break
                  geom.append({'lat':p['lat'],'lon':p['lon']})
              if missing or len(geom) < 2:
                  continue
              item = {'type':'way','id':wid,'tags':tags,'geometry':geom}
              if tags.get('building'):
                  buildings.append(item)
              if tags.get('highway'):
                  roads.append(item)
              if (
                  tags.get('waterway') in {'river','riverbank'} or
                  tags.get('natural') == 'water' or
                  tags.get('leisure') == 'park' or
                  tags.get('landuse') == 'grass'
              ):
                  environment.append(item)

          out = Path('karlstad-city-mobile/data')
          payloads = {
              'osm-buildings.json': {'version':0.6,'generator':'Karlstad City snapshot','elements':buildings},
              'osm-roads.json': {'version':0.6,'generator':'Karlstad City snapshot','elements':roads},
              'osm-environment.json': {'version':0.6,'generator':'Karlstad City snapshot','elements':environment},
              'osm-trees.json': {'version':0.6,'generator':'Karlstad City snapshot','elements':tree_nodes},
          }
          for name, payload in payloads.items():
              (out/name).write_text(json.dumps(payload, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          meta = {
              'updated': datetime.now(timezone.utc).isoformat(),
              'source': 'OpenStreetMap API 0.6 map extract',
              'bbox': [13.4974,59.3780,13.5086,59.3857],
              'counts': {
                  'buildings': len(buildings),
                  'roads': len(roads),
                  'environment': len(environment),
                  'trees': len(tree_nodes)
              }
          }
          (out/'meta.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(meta, indent=2))

          if len(buildings) < 150:
              raise SystemExit(f'Too few buildings: {len(buildings)}')
          if len(roads) < 150:
              raise SystemExit(f'Too few roads: {len(roads)}')
          PY

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karlstad-city-mobile/data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "Update bundled Karlstad OSM snapshot"
            git push
          fi
